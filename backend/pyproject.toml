[project]
name = "airday"
version = "0.1.0"
description = "Daily air-safety plans for school timetables"
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.3",
    "aws-lambda-powertools[tracer]==3.35.0",
]

[project.optional-dependencies]
agent = ["strands-agents[gemini]==1.58.1"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "jsonschema==4.25.1",
    "boto3==1.40.49",
    "moto[dynamodb]==5.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Fixture rows and report table strings read better unwrapped.
"tests/*" = ["E501"]
"backtest/*" = ["E501"]
